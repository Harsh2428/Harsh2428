<?xml version="1.0" encoding="UTF-8"?>

<svg
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 1180 610"
width="1180"
height="610">

<defs>

<!-- Background -->

<linearGradient id="bg"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#FFFFFF">
<animate attributeName="stop-color"
values="#FFFFFF;#081225;#FFFFFF"
dur="12s"
repeatCount="indefinite"/>
</stop>

<stop offset="100%"
stop-color="#0F172A"/>

</linearGradient>

<!-- Accent -->

<linearGradient id="accent">

<stop offset="0%"
stop-color="#2563EB"/>

<stop offset="50%"
stop-color="#06B6D4"/>

<stop offset="100%"
stop-color="#059669"/>

<animateTransform
attributeName="gradientTransform"
type="rotate"
from="0 .5 .5"
to="360 .5 .5"
dur="18s"
repeatCount="indefinite"/>

</linearGradient>

<!-- Glow -->

<filter id="glow">

<feGaussianBlur stdDeviation="8"/>

</filter>

</defs>

<!-- Background -->

<rect
width="1180"
height="610"
fill="url(#bg)"/>

<!-- Left glow -->

<circle
cx="200"
cy="180"
r="170"
fill="#7C3AED"
opacity=".12"
filter="url(#glow)">

<animate
attributeName="cx"
values="180;240;180"
dur="10s"
repeatCount="indefinite"/>

</circle>

<!-- Right glow -->

<circle
cx="980"
cy="420"
r="180"
fill="#22D3EE"
opacity=".10"
filter="url(#glow)">

<animate
attributeName="cy"
values="420;390;420"
dur="12s"
repeatCount="indefinite"/>

</circle>

<!-- ========================= -->
<!-- Main Glass Card -->
<!-- ========================= -->

<rect
x="20"
y="20"
width="1140"
height="570"
rx="28"
fill="#0F172A"
fill-opacity=".92"
stroke="url(#accent)"
stroke-width="1.4">

<animate
attributeName="stroke-opacity"
values=".25;1;.25"
dur="4s"
repeatCount="indefinite"/>

</rect>

<!-- ========================= -->
<!-- Left Panel -->
<!-- ========================= -->

<rect
x="45"
y="45"
width="360"
height="520"
rx="22"
fill="#111827"
fill-opacity=".88"
stroke="#FFFFFF"
stroke-opacity=".05"/>
<animateTransform
attributeName="transform"
type="translate"
values="0 0;0 -3;0 0"
dur="5s"
repeatCount="indefinite"/>
<!-- ========================= -->
<!-- Right Panel -->
<!-- ========================= -->

<rect
x="430"
y="45"
width="705"
height="520"
rx="22"
fill="#111827"
fill-opacity=".88"
stroke="#FFFFFF"
stroke-opacity=".05"/>
<animateTransform
attributeName="transform"
type="translate"
values="0 0;0 -3;0 0"
dur="5s"
repeatCount="indefinite"/>
<!-- ========================= -->
<!-- Glass Reflection -->
<!-- ========================= -->

<path

d="
M40 40
L350 40
L250 580
L40 580
Z"

fill="white"
opacity=".03">

<animate

attributeName="opacity"

values=".01;.05;.01"

dur="6s"

repeatCount="indefinite"/>

</path>
<!-- ========================= -->
<!-- TERMINAL -->
<!-- ========================= -->

<g id="terminal">

<!-- Header -->
<!-- Greeting -->

<text

x="480"

y="155"

fill="#22D3EE"

font-size="28"

font-family="monospace">

Hi

</text>

<!-- Name -->
<!-- ========================= -->
<!-- Animated Roles -->
<!-- ========================= -->
<text x="480" y="315" fill="#94A3B8" font-size="18" font-family="monospace">
📍 Uttar Pradesh, India
</text>

<text x="480" y="345" fill="#94A3B8" font-size="18" font-family="monospace">
🎓 KIET Group of Institutions
</text>

<text x="480" y="375" fill="#94A3B8" font-size="18" font-family="monospace">
🎓 IIT Madras BS (DS &amp; AI)
</text>

<text x="480" y="405" fill="#94A3B8" font-size="18" font-family="monospace">
🌱 Machine Learning • Android • Open Source
</text>
<g
font-family="monospace"
font-size="23"
fill="url(#accent)">

<text x="480" y="255">

Machine Learning Engineer

<animate

attributeName="opacity"

values="1;1;0;0"

dur="16s"

keyTimes="0;0.22;0.25;1"

repeatCount="indefinite"/>

</text>

<text x="480" y="255" opacity="0">

AI Developer

<animate

attributeName="opacity"

values="0;0;1;1;0"

dur="16s"

keyTimes="0;0.25;0.28;0.47;0.50"

repeatCount="indefinite"/>

</text>

<text x="480" y="255" opacity="0">

Android Developer

<animate

attributeName="opacity"

values="0;0;1;1;0"

dur="16s"

keyTimes="0;0.50;0.53;0.72;0.75"

repeatCount="indefinite"/>

</text>

<text x="480" y="255" opacity="0">

Open Source Contributor

<animate

attributeName="opacity"

values="0;0;1;1;0"

dur="16s"

keyTimes="0;0.75;0.78;0.97;1"

repeatCount="indefinite"/>

</text>

<!-- Cursor -->

<text
x="860"
y="255"
fill="#22D3EE">

|

<animate

attributeName="opacity"

values="1;0;1"

dur=".8s"

repeatCount="indefinite"/>

</text>

</g>
<text

x="480"

y="205"

fill="#F8FAFC"

font-size="34"

font-family="monospace"
font-weight="bold">

I'm Harshvardhan Srivastava

</text>
<rect

x="450"

y="65"

width="665"

height="42"

rx="12"

fill="#1E293B"/>

<!-- macOS Buttons -->

<circle cx="475" cy="86" r="6" fill="#FF5F56"/>
<circle cx="495" cy="86" r="6" fill="#FFBD2E"/>
<circle cx="515" cy="86" r="6" fill="#27C93F"/>

<!-- Terminal Title -->

<text

x="560"

y="92"

fill="#94A3B8"

font-family="monospace"

font-size="15">

harsh@developer:~

</text>
<!-- ========================= -->
<!-- Skills Title -->
<!-- ========================= -->

<text
x="480"
y="455"
fill="#F8FAFC"
font-size="20"
font-family="Inter,Segoe UI,Arial,sans-serif"
font-weight="600">

Tech Stack

</text>

<!-- ========================= -->
