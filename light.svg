</g>
<!-- ========================= -->
<!-- Floating Particles -->
<!-- ========================= -->
<!-- ========================= -->
<!-- Scanline -->
<!-- ========================= -->
<!-- ========================= -->
<!-- Ambient Glow -->
<!-- ========================= -->

<circle
cx="1040"
cy="100"
r="120"
fill="#22D3EE"
opacity=".06"
filter="url(#glow)">

<animate
attributeName="r"
values="120;145;120"
dur="8s"
repeatCount="indefinite"/>

</circle>

<circle
cx="180"
cy="500"
r="130"
fill="#7C3AED"
opacity=".05"
filter="url(#glow)">

<animate
attributeName="r"
values="130;160;130"
dur="9s"
repeatCount="indefinite"/>

</circle>
<rect
x="20"
y="-25"
width="1140"
height="18"
fill="#22D3EE"
opacity=".05">

<animate
attributeName="y"
values="-25;610;-25"
dur="6s"
repeatCount="indefinite"/>

</rect>
<g id="particles">

<circle cx="120" cy="120" r="2" fill="#22D3EE" opacity=".8">
<animate attributeName="cy"
values="120;90;120"
dur="8s"
repeatCount="indefinite"/>
</circle>

<circle cx="210" cy="480" r="2" fill="#7C3AED" opacity=".7">
<animate attributeName="cy"
values="480;450;480"
dur="10s"
repeatCount="indefinite"/>
</circle>

<circle cx="340" cy="180" r="3" fill="#10B981">
<animate attributeName="cy"
values="180;150;180"
dur="7s"
repeatCount="indefinite"/>
</circle>

<circle cx="620" cy="150" r="2" fill="#22D3EE">
<animate attributeName="cy"
values="150;120;150"
dur="9s"
repeatCount="indefinite"/>
</circle>

<circle cx="760" cy="500" r="2" fill="#7C3AED">
<animate attributeName="cy"
values="500;470;500"
dur="8s"
repeatCount="indefinite"/>
</circle>

<circle cx="980" cy="220" r="3" fill="#10B981">
<animate attributeName="cy"
values="220;190;220"
dur="11s"
repeatCount="indefinite"/>
</circle>

<circle cx="1080" cy="430" r="2" fill="#22D3EE">
<animate attributeName="cy"
values="430;400;430"
dur="9s"
repeatCount="indefinite"/>
</circle>

</g>
</svg>
